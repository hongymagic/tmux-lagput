---
name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9].[0-9]*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-trigger:
    name: Validate release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual releases must be dispatched from main."
          exit 1

  ci:
    name: Verify release
    needs: validate-trigger
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare CalVer release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      first_release: ${{ steps.release.outputs.first_release }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            ./scripts/calver.sh validate-tag "$tag"
            git fetch --no-tags origin main
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
              echo "::error::$tag does not point to a commit on main."
              exit 1
            fi
            prior_stable_count="$(git tag --list | grep -F -x -v "$tag" | grep -E -c '^v[0-9]{4}\.[0-9]{4}\.[0-9]+$' || true)"
            {
              echo "should_release=true"
              echo "tag=$tag"
              echo "target_sha=$tagged_commit"
              if [[ "$prior_stable_count" -eq 0 ]]; then
                echo "first_release=true"
              else
                echo "first_release=false"
              fi
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=("$tag")
          done < <(git tag --list)
          latest="$(./scripts/calver.sh latest "${tags[@]}" 2>/dev/null || true)"
          if [[ -n "$latest" ]] && git diff --quiet "$latest..HEAD"; then
            echo "No changes since $latest; skipping release."
            {
              echo "should_release=false"
              echo "tag="
              echo "target_sha="
              echo "first_release=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next="$(./scripts/calver.sh next "$(./scripts/calver.sh today)" "${tags[@]}")"
          {
            echo "should_release=true"
            echo "tag=$next"
            echo "target_sha=$(git rev-parse HEAD)"
            if [[ -z "$latest" ]]; then
              echo "first_release=true"
            else
              echo "first_release=false"
            fi
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TARGET: ${{ needs.prepare.outputs.target_sha }}
          FIRST_RELEASE: ${{ needs.prepare.outputs.first_release }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release."
          elif git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [[ "$FIRST_RELEASE" == true ]]; then
              gh release create "$RELEASE_TAG" \
                --notes-file .github/initial-release-notes.md \
                --title "$RELEASE_TAG" \
                --verify-tag
            else
              gh release create "$RELEASE_TAG" \
                --generate-notes \
                --title "$RELEASE_TAG" \
                --verify-tag
            fi
          else
            if [[ "$FIRST_RELEASE" == true ]]; then
              gh release create "$RELEASE_TAG" \
                --notes-file .github/initial-release-notes.md \
                --target "$RELEASE_TARGET" \
                --title "$RELEASE_TAG"
            else
              gh release create "$RELEASE_TAG" \
                --generate-notes \
                --target "$RELEASE_TARGET" \
                --title "$RELEASE_TAG"
            fi
          fi
