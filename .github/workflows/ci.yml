---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck tmux

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ripgrep shellcheck tmux

      - name: Run behavioural tests
        run: |
          bash tests/test.sh
          bash tests/test-calver.sh

      - name: Smoke-test current tmux
        run: bash tests/smoke-tmux.sh

      - name: Check shell syntax
        run: |
          for file in tmux-send-later.tmux scripts/*.sh tests/*.sh tests/fixtures/* tests/fixtures-*/*; do
              [ -f "$file" ] || continue
              bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck tmux-send-later.tmux scripts/*.sh tests/*.sh tests/fixtures/* tests/fixtures-*/*

  minimum-tmux:
    name: Minimum tmux (3.3a)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMUX_VERSION: 3.3a
      TMUX_SHA256: e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libevent-dev libncurses-dev pkg-config ripgrep

      - name: Build minimum supported tmux
        run: |
          archive="tmux-${TMUX_VERSION}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/${archive}"
          printf '%s  %s\n' "$TMUX_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive"
          cd "tmux-${TMUX_VERSION}"
          ./configure --prefix="$RUNNER_TEMP/tmux-${TMUX_VERSION}"
          make --jobs="$(nproc)"
          make install

      - name: Smoke-test minimum supported tmux
        run: bash tests/smoke-tmux.sh "$RUNNER_TEMP/tmux-${TMUX_VERSION}/bin/tmux"
