<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">tmux-lagput schedule form and pending-send palette</title>
  <desc id="description">A dark terminal window showing a delayed send to a captured tmux pane and a searchable list of pending sends.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172a"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77e5c1"/>
      <stop offset="1" stop-color="#75a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="35" y="35" width="1130" height="610" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="680" fill="url(#background)"/>
  <circle cx="1090" cy="94" r="220" fill="#75a7ff" opacity="0.05"/>
  <circle cx="92" cy="618" r="200" fill="#77e5c1" opacity="0.04"/>

  <g filter="url(#shadow)">
    <rect x="35" y="35" width="1130" height="610" rx="18" fill="#0d1220" stroke="#303a52" stroke-width="2"/>
  </g>

  <g clip-path="url(#window-clip)">
    <rect x="35" y="35" width="1130" height="48" fill="#1a2132"/>
    <circle cx="66" cy="59" r="6" fill="#ff6b7a"/>
    <circle cx="88" cy="59" r="6" fill="#f6c85f"/>
    <circle cx="110" cy="59" r="6" fill="#66d99f"/>
    <text x="600" y="64" fill="#aab5cc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">tmux · work</text>

    <rect x="35" y="83" width="1130" height="522" fill="#0b101c"/>
    <path d="M600 83V605" stroke="#242d41" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="125" fill="#6c7892" font-size="14">work:2.1</text>
      <text x="70" y="158" fill="#d8deea" font-size="16">$ deploy --watch</text>
      <text x="70" y="185" fill="#8793aa" font-size="14">Waiting for approval…</text>

      <rect x="102" y="214" width="465" height="337" rx="12" fill="#121a2b" stroke="#53617c" stroke-width="2"/>
      <rect x="102" y="214" width="465" height="44" rx="12" fill="#1a2438"/>
      <path d="M102 246V226a12 12 0 0 1 12-12h441a12 12 0 0 1 12 12v20z" fill="#1a2438"/>
      <text x="334" y="242" fill="#f2f5fa" font-size="15" font-weight="600" text-anchor="middle">Schedule delayed send</text>

      <text x="130" y="287" fill="#8290aa" font-size="13">CAPTURED TARGET</text>
      <rect x="130" y="299" width="409" height="38" rx="7" fill="#0c1220" stroke="#303d57"/>
      <circle cx="150" cy="318" r="5" fill="#77e5c1"/>
      <text x="165" y="323" fill="#d9e1ef" font-size="14">work:2.1</text>
      <text x="510" y="323" fill="#75819a" font-size="13" text-anchor="end">%7</text>

      <text x="130" y="365" fill="#8290aa" font-size="13">TEXT</text>
      <rect x="130" y="377" width="409" height="42" rx="7" fill="#0c1220" stroke="#75a7ff"/>
      <text x="147" y="403" fill="#f3f6fb" font-size="15">Continue</text>
      <rect x="213" y="388" width="2" height="19" fill="#75a7ff"/>

      <text x="130" y="447" fill="#8290aa" font-size="13">DELAY</text>
      <rect x="130" y="459" width="190" height="42" rx="7" fill="#0c1220" stroke="#303d57"/>
      <text x="147" y="485" fill="#f3f6fb" font-size="15">30m</text>
      <text x="342" y="447" fill="#8290aa" font-size="13">THEN KEY</text>
      <rect x="342" y="459" width="197" height="42" rx="7" fill="#0c1220" stroke="#303d57"/>
      <text x="359" y="485" fill="#f3f6fb" font-size="15">Enter</text>

      <rect x="403" y="517" width="136" height="34" rx="7" fill="url(#accent)"/>
      <text x="471" y="539" fill="#08111d" font-size="14" font-weight="700" text-anchor="middle">Schedule ↵</text>

      <text x="632" y="125" fill="#6c7892" font-size="14">work:3.0</text>
      <text x="632" y="158" fill="#d8deea" font-size="16">$ rg TODO</text>

      <rect x="632" y="184" width="501" height="367" rx="12" fill="#121a2b" stroke="#53617c" stroke-width="2"/>
      <rect x="632" y="184" width="501" height="44" rx="12" fill="#1a2438"/>
      <path d="M632 216V196a12 12 0 0 1 12-12h477a12 12 0 0 1 12 12v20z" fill="#1a2438"/>
      <text x="882" y="212" fill="#f2f5fa" font-size="15" font-weight="600" text-anchor="middle">Pending delayed sends</text>

      <text x="658" y="257" fill="#8290aa" font-size="13">Pending &gt;</text>
      <rect x="733" y="240" width="374" height="28" rx="6" fill="#0c1220" stroke="#303d57"/>
      <text x="747" y="259" fill="#68748c" font-size="13">search target or text</text>

      <text x="658" y="300" fill="#6f7d97" font-size="12">REMAINING</text>
      <text x="765" y="300" fill="#6f7d97" font-size="12">TARGET</text>
      <text x="892" y="300" fill="#6f7d97" font-size="12">TEXT</text>

      <rect x="650" y="313" width="465" height="50" rx="7" fill="#20304a" stroke="#75a7ff"/>
      <rect x="650" y="313" width="4" height="50" rx="2" fill="url(#accent)"/>
      <text x="666" y="343" fill="#8fdcc6" font-size="14">29m58s</text>
      <text x="765" y="343" fill="#dce3ef" font-size="14">work:2.1</text>
      <text x="892" y="343" fill="#f4f6fa" font-size="14">Continue</text>

      <rect x="650" y="372" width="465" height="50" rx="7" fill="#0d1423"/>
      <text x="666" y="402" fill="#a8b3c7" font-size="14">1h12m</text>
      <text x="765" y="402" fill="#c6cedc" font-size="14">api:1.0</text>
      <text x="892" y="402" fill="#c6cedc" font-size="14">run migration</text>

      <rect x="650" y="431" width="465" height="50" rx="7" fill="#0d1423"/>
      <text x="666" y="461" fill="#a8b3c7" font-size="14">1d2h</text>
      <text x="765" y="461" fill="#c6cedc" font-size="14">notes:4.2</text>
      <text x="892" y="461" fill="#c6cedc" font-size="14">Follow up</text>

      <path d="M650 498H1115" stroke="#273149"/>
      <text x="658" y="526" fill="#71809b" font-size="12">Enter cancel · Ctrl-R refresh · Esc close</text>

      <rect x="35" y="605" width="1130" height="40" fill="#18243a"/>
      <rect x="35" y="605" width="168" height="40" fill="#77e5c1"/>
      <text x="119" y="630" fill="#07121a" font-size="14" font-weight="700" text-anchor="middle">tmux-lagput</text>
      <text x="224" y="630" fill="#d3dae7" font-size="13">prefix + T · schedule</text>
      <text x="455" y="630" fill="#8190aa" font-size="13">prefix + C-t · manage</text>
      <text x="1137" y="630" fill="#8190aa" font-size="13" text-anchor="end">captured once · delivered later</text>
    </g>
  </g>
</svg>
